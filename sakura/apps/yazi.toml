[meta]
app = "yazi"
schema = 1
handler = "file"
target = "~/.config/yazi"
filename = "theme.toml"
dynamic = false

[content]
text = """
[app]
overall = { bg = "#FFF5F5" }

[mgr]
cwd = { fg = "#2D2D2D", bold = true }
find_keyword = { fg = "#00838F", reversed = true }
find_position = { fg = "#00838F", bold = true, italic = true }
symlink_target = { fg = "#0288D1" }
marker_copied = { fg = "#43A047", bg = "#43A047" }
marker_cut = { fg = "#D64545", bg = "#D64545" }
marker_marked = { fg = "#7E57C2", bg = "#7E57C2" }
marker_selected = { fg = "#00838F", bg = "#00838F" }
count_copied = { fg = "#43A047", bold = true, reversed = true }
count_cut = { fg = "#D64545", bold = true, reversed = true }
count_selected = { fg = "#00838F", bold = true, reversed = true }
border_symbol = "│"
border_style = { fg = "#E8C0C0" }

[indicator]
parent = { underline = true }
current = { fg = "#2D2D2D", bg = "#EDD0D0" }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#2D2D2D", bg = "#F2DDDD", bold = true }
inactive = { fg = "#757575", bg = "#EDD0D0" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#2D2D2D", bg = "#F2DDDD", bold = true }
normal_alt = { fg = "#757575", bg = "#EDD0D0" }
select_main = { fg = "#FFF5F5", bg = "#00838F", bold = true }
select_alt = { fg = "#00838F", bg = "#CC7A7A" }
unset_main = { fg = "#FFF5F5", bg = "#E05A77", bold = true }
unset_alt = { fg = "#E05A77", bg = "#CC7A7A" }

[status]
overall = { fg = "#2D2D2D" }
sep_left = { open = "", close = "]" }
sep_right = { open = "[", close = "" }
perm_type = { fg = "#42A5F5" }
perm_read = { fg = "#D4A017" }
perm_write = { fg = "#D64545" }
perm_exec = { fg = "#43A047" }
perm_sep = { fg = "#757575" }
progress_label = { fg = "#FFF5F5" }
progress_normal = { fg = "#FFF5F5", bg = "#388E3C" }
progress_error = { bg = "#D32F2F" }

[which]
cols = 3
mask = { bg = "#F5DADA" }
cand = { fg = "#00838F", bold = true }
rest = { fg = "#00838F", italic = true }
desc = { fg = "#616161" }
separator = " "
separator_style = { fg = "#616161" }

[confirm]
border = { fg = "#E8C0C0" }
title = { fg = "#616161", bold = true }
body = { fg = "#2D2D2D", bold = true }
list = { fg = "#2D2D2D" }
btn_yes = { fg = "#2D2D2D", bg = "#388E3C", bold = true }
btn_no = { fg = "#757575", bg = "#EDD0D0" }
btn_labels = [ "Yes", "No" ]

[spot]
border = { fg = "#E8C0C0" }
title = { fg = "#616161", bold = true }
tbl_col = { fg = "#757575" }
tbl_cell = { fg = "#2D2D2D", bg = "#EDD0D0" }

[notify]
title_info = { fg = "#1976D2" }
title_warn = { fg = "#E65100" }
title_error = { fg = "#D32F2F" }

[pick]
border = { fg = "#E8C0C0", bold = true }
active = { fg = "#2D2D2D" }
inactive = { fg = "#757575" }

[input]
border = { fg = "#E8C0C0" }
title = { fg = "#616161", bold = true }
value = { fg = "#2D2D2D" }
selected = { bg = "#F5DADA" }

[cmp]
border = { fg = "#E8C0C0", bold = true }
active = { fg = "#2D2D2D", bg = "#EDD0D0" }
inactive = { fg = "#757575" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#E8C0C0" }
title = { fg = "#616161", bold = true }
hovered = { fg = "#2D2D2D", bg = "#EDD0D0" }

[help]
on = { fg = "#42A5F5" }
run = { fg = "#00838F" }
desc = { fg = "#616161", italic = true }
hovered = { bg = "#EDD0D0" }
footer = { fg = "#FFF5F5", bg = "#00838F", bold = true }
icon_info = "ℹ"
icon_warn = "⚠"
icon_error = "✖"

[filetype]
rules = [
  { mime = "inode/empty", fg = "#757575" },
  { url = "*", is = "orphan", fg = "#757575" },
  { url = "*/", is = "orphan", fg = "#757575" },
  { url = "*", is = "link", fg = "#0288D1" },
  { url = "*/", is = "link", fg = "#0288D1" },
  { url = "*", is = "block", fg = "#C62828" },
  { url = "*", is = "char", fg = "#C62828" },
  { url = "*", is = "fifo", fg = "#E91E63" },
  { url = "*", is = "sock", fg = "#E91E63" },
  { url = "*", is = "sticky", fg = "#F57C00" },
  { url = "*", is = "dummy", fg = "#757575" },
  { url = "*/", fg = "#42A5F5" },
  { url = "*", is = "exec", fg = "#43A047" },
  { mime = "image/*", fg = "#E05A77" },
  { mime = "video/*", fg = "#E91E63" },
  { mime = "audio/*", fg = "#7E57C2" },
  { mime = "text/*", fg = "#2D2D2D" },
  { mime = "application/json", fg = "#D4A017" },
  { mime = "application/zip", fg = "#C62828" },
  { mime = "application/pdf", fg = "#D64545" },
  { url = "*", fg = "#757575" }
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#00838F" },
  { name = ".git", text = "", fg = "#E65100" },
  { name = ".github", text = "", fg = "#757575" },
  { name = ".npm", text = "", fg = "#D64545" },
  { name = "Desktop", text = "", fg = "#42A5F5" },
  { name = "Development", text = "", fg = "#43A047" },
  { name = "Documents", text = "", fg = "#D4A017" },
  { name = "Downloads", text = "", fg = "#0288D1" },
  { name = "Library", text = "", fg = "#7E57C2" },
  { name = "Movies", text = "", fg = "#E91E63" },
  { name = "Music", text = "", fg = "#E05A77" },
  { name = "Pictures", text = "", fg = "#00838F" },
  { name = "Public", text = "", fg = "#757575" },
  { name = "Videos", text = "", fg = "#C62828" }
]
conds = [
  { if = "orphan", text = "", fg = "#757575" },
  { if = "link", text = "", fg = "#0288D1" },
  { if = "block", text = "", fg = "#C62828" },
  { if = "char", text = "", fg = "#C62828" },
  { if = "fifo", text = "", fg = "#E91E63" },
  { if = "sock", text = "", fg = "#E91E63" },
  { if = "sticky", text = "", fg = "#F57C00" },
  { if = "dummy", text = "", fg = "#757575" },
  { if = "dir", text = "", fg = "#00838F" },
  { if = "exec", text = "", fg = "#43A047" },
  { if = "!dir", text = "", fg = "#757575" }
]

"""
