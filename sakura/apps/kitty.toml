[meta]
app = "kitty"
schema = 1
handler = "file"
target = "~/.config/kitty"
filename = "kitty.conf"
dynamic = false

[content]
text = """
background #FFF5F5
foreground #2D2D2D
cursor #F0CECE
selection_background #F5DADA
selection_foreground #FFF5F5
url_color #1976D2

# Normal colors
color0 #FFF5F5
color1 #D64545
color2 #43A047
color3 #D4A017
color4 #42A5F5
color5 #E91E63
color6 #00838F
color7 #2D2D2D

# Bright colors
color8 #F2DDDD
color9 #C62828
color10 #D4A017
color11 #E65100
color12 #0288D1
color13 #E05A77
color14 #0277BD
color15 #757575

# Marks
mark1_foreground #1976D2
mark2_foreground #388E3C
mark3_foreground #E65100

# Tabs
tab_bar_background #F5E0E0
tab_bar_margin_color #FFF5F5
active_tab_background #F5DADA
active_tab_foreground #2D2D2D
inactive_tab_background #F2DDDD
inactive_tab_foreground #757575

# Window
active_border_color #E8C0C0
inactive_border_color #F2DDDD

font_family Monospace
font_size 10
confirm_os_window_close 0

"""
