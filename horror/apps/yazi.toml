[meta]
app = "yazi"
schema = 1
handler = "file"
target = "~/.config/yazi"
filename = "theme.toml"
dynamic = false

[content]
text = """
[app]
overall = { bg = "#0a0908" }

[mgr]
cwd = { fg = "#e8dcc8", bold = true }
find_keyword = { fg = "#6ABAAA", reversed = true }
find_position = { fg = "#6ABAAA", bold = true, italic = true }
symlink_target = { fg = "#7AAABA" }
marker_copied = { fg = "#9ABA5E", bg = "#9ABA5E" }
marker_cut = { fg = "#E86A4A", bg = "#E86A4A" }
marker_marked = { fg = "#9A8ABA", bg = "#9A8ABA" }
marker_selected = { fg = "#6ABAAA", bg = "#6ABAAA" }
count_copied = { fg = "#9ABA5E", bold = true, reversed = true }
count_cut = { fg = "#E86A4A", bold = true, reversed = true }
count_selected = { fg = "#6ABAAA", bold = true, reversed = true }
border_symbol = "│"
border_style = { fg = "#3a3028" }

[indicator]
parent = { underline = true }
current = { fg = "#e8dcc8", bg = "#242018" }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#e8dcc8", bg = "#242018", bold = true }
inactive = { fg = "#c4b49a", bg = "#242018" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#e8dcc8", bg = "#242018", bold = true }
normal_alt = { fg = "#c4b49a", bg = "#242018" }
select_main = { fg = "#0a0908", bg = "#6ABAAA", bold = true }
select_alt = { fg = "#6ABAAA", bg = "#D0806A" }
unset_main = { fg = "#0a0908", bg = "#E08A9A", bold = true }
unset_alt = { fg = "#E08A9A", bg = "#D0806A" }

[status]
overall = { fg = "#e8dcc8" }
sep_left = { open = "", close = "]" }
sep_right = { open = "[", close = "" }
perm_type = { fg = "#4A7C9A" }
perm_read = { fg = "#F0C040" }
perm_write = { fg = "#E86A4A" }
perm_exec = { fg = "#9ABA5E" }
perm_sep = { fg = "#c4b49a" }
progress_label = { fg = "#0a0908" }
progress_normal = { fg = "#0a0908", bg = "#7ABA5E" }
progress_error = { bg = "#D4553A" }

[which]
cols = 3
mask = { bg = "#0f0d08" }
cand = { fg = "#6ABAAA", bold = true }
rest = { fg = "#6ABAAA", italic = true }
desc = { fg = "#8a7a64" }
separator = " "
separator_style = { fg = "#8a7a64" }

[confirm]
border = { fg = "#3a3028" }
title = { fg = "#8a7a64", bold = true }
body = { fg = "#e8dcc8", bold = true }
list = { fg = "#e8dcc8" }
btn_yes = { fg = "#e8dcc8", bg = "#7ABA5E", bold = true }
btn_no = { fg = "#c4b49a", bg = "#242018" }
btn_labels = [ "Yes", "No" ]

[spot]
border = { fg = "#3a3028" }
title = { fg = "#8a7a64", bold = true }
tbl_col = { fg = "#c4b49a" }
tbl_cell = { fg = "#e8dcc8", bg = "#242018" }

[notify]
title_info = { fg = "#7AAECE" }
title_warn = { fg = "#E8A040" }
title_error = { fg = "#D4553A" }

[pick]
border = { fg = "#3a3028", bold = true }
active = { fg = "#e8dcc8" }
inactive = { fg = "#c4b49a" }

[input]
border = { fg = "#3a3028" }
title = { fg = "#8a7a64", bold = true }
value = { fg = "#e8dcc8" }
selected = { bg = "#0f0d08" }

[cmp]
border = { fg = "#3a3028", bold = true }
active = { fg = "#e8dcc8", bg = "#242018" }
inactive = { fg = "#c4b49a" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#3a3028" }
title = { fg = "#8a7a64", bold = true }
hovered = { fg = "#e8dcc8", bg = "#242018" }

[help]
on = { fg = "#4A7C9A" }
run = { fg = "#6ABAAA" }
desc = { fg = "#8a7a64", italic = true }
hovered = { bg = "#242018" }
footer = { fg = "#0a0908", bg = "#6ABAAA", bold = true }
icon_info = "ℹ"
icon_warn = "⚠"
icon_error = "✖"

[filetype]
rules = [
  { mime = "inode/empty", fg = "#8a7a64" },
  { url = "*", is = "orphan", fg = "#8a7a64" },
  { url = "*/", is = "orphan", fg = "#8a7a64" },
  { url = "*", is = "link", fg = "#7AAABA" },
  { url = "*/", is = "link", fg = "#7AAABA" },
  { url = "*", is = "block", fg = "#B84A3A" },
  { url = "*", is = "char", fg = "#B84A3A" },
  { url = "*", is = "fifo", fg = "#E07A9A" },
  { url = "*", is = "sock", fg = "#E07A9A" },
  { url = "*", is = "sticky", fg = "#F0B040" },
  { url = "*", is = "dummy", fg = "#8a7a64" },
  { url = "*/", fg = "#4A7C9A" },
  { url = "*", is = "exec", fg = "#9ABA5E" },
  { mime = "image/*", fg = "#E08A9A" },
  { mime = "video/*", fg = "#E07A9A" },
  { mime = "audio/*", fg = "#9A8ABA" },
  { mime = "text/*", fg = "#e8dcc8" },
  { mime = "application/json", fg = "#F0C040" },
  { mime = "application/zip", fg = "#B84A3A" },
  { mime = "application/pdf", fg = "#E86A4A" },
  { url = "*", fg = "#c4b49a" }
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#6ABAAA" },
  { name = ".git", text = "", fg = "#F0A850" },
  { name = ".github", text = "", fg = "#c4b49a" },
  { name = ".npm", text = "", fg = "#E86A4A" },
  { name = "Desktop", text = "", fg = "#4A7C9A" },
  { name = "Development", text = "", fg = "#9ABA5E" },
  { name = "Documents", text = "", fg = "#F0C040" },
  { name = "Downloads", text = "", fg = "#7AAABA" },
  { name = "Library", text = "", fg = "#9A8ABA" },
  { name = "Movies", text = "", fg = "#E07A9A" },
  { name = "Music", text = "", fg = "#E08A9A" },
  { name = "Pictures", text = "", fg = "#6ABAAA" },
  { name = "Public", text = "", fg = "#c4b49a" },
  { name = "Videos", text = "", fg = "#B84A3A" }
]
conds = [
  { if = "orphan", text = "", fg = "#8a7a64" },
  { if = "link", text = "", fg = "#7AAABA" },
  { if = "block", text = "", fg = "#B84A3A" },
  { if = "char", text = "", fg = "#B84A3A" },
  { if = "fifo", text = "", fg = "#E07A9A" },
  { if = "sock", text = "", fg = "#E07A9A" },
  { if = "sticky", text = "", fg = "#F0B040" },
  { if = "dummy", text = "", fg = "#8a7a64" },
  { if = "dir", text = "", fg = "#6ABAAA" },
  { if = "exec", text = "", fg = "#9ABA5E" },
  { if = "!dir", text = "", fg = "#c4b49a" }
]

"""
